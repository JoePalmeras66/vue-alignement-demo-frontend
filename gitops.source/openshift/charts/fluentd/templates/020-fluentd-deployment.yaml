kind: Deployment
apiVersion: apps/v1
metadata:
  name: {{ .Values.deployment.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ .Values.deployment.name }}
    app.kubernetes.io/component: {{ .Values.deployment.name }}
    app.kubernetes.io/instance: {{ .Values.deployment.name }}
    app.kubernetes.io/name: {{ .Values.deployment.name }}
    app.openshift.io/runtime: elastic
    app.openshift.io/runtime-namespace: {{ .Values.global.namespace }}
  # add automatic container update here
  annotations:
    image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"{{ .Values.deployment.name }}:{{ .Values.deployment.image_version }}","namespace":"{{ .Values.global.namespace }}"},"fieldPath":"spec.template.spec.containers[?(@.name==\"{{ .Values.deployment.name }}\")].image"}]'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.deployment.name }}
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: {{ .Values.deployment.name }}
    spec:
      volumes:
        - name: fluentd-volume
          configMap:
            name: {{ .Values.deployment.configmap_name }}
            defaultMode: 420
      containers:
        - name: {{ .Values.deployment.name }}
          resources:
            requests:
              cpu: '50m'
              memory: 64Mi
            limits:
              cpu: '500m'
              memory: 256Mi
          image: '{{ .Values.global.namespace }}/{{ .Values.deployment.name }}:{{ .Values.deployment.image_version }}'
          ports:
            - containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: fluentd-volume
              mountPath: /fluentd/etc/fluent.conf
              subPath: fluent.conf
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: Always
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext: {}
      schedulerName: default-scheduler
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600
