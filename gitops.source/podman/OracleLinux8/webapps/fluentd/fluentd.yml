apiVersion: v1
kind: Pod
metadata:
  name: fluentd
spec:
  containers:
    - name: fluentd
      image: docker.io/fluentd:v1.14.0-1.0
      imagePullPolicy: ifNotPresent
      resources:
        limits:
          memory: 1Gi
      securityContext: {}
      ports:
        - containerPort: 9880
          hostPort: 9880
      volumeMounts:
        - mountPath: /fluentd/etc/fluent.conf:Z
          name: fluentd-config-file
  volumes:
    - name: fluentd-config-file
      hostpath:
        path: /home/podman/conf/fluentd.conf
        type: File
  restartPolicy: Never
